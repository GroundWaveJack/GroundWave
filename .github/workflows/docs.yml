name: Documentation quality

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  markdown:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DavidAnson/markdownlint-cli2-action@v20
      - uses: crate-ci/typos@v1
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config .lychee.toml "**/*.md"
          fail: true
